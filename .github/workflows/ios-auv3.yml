name: iOS AUv3 + IPA

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: iOS deployment target
        type: string
        default: "17.0"
      signed:
        description: Build a signed IPA (requires the Apple secrets listed in BUILD.md)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AUv3 + IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD_DIR: build-ios
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target || '17.0' }}
      CONTENT_URL: ${{ vars.GH_CONTENT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore sample library
        run: |
          set -euo pipefail
          if [ -f Content/catalog.json ]; then
            echo "Using the sample library from the checkout."
            exit 0
          fi
          if [ -n "${CONTENT_URL}" ]; then
            echo "Downloading the sample library from GH_CONTENT_URL."
            curl -fsSL "${CONTENT_URL}" -o "${RUNNER_TEMP}/content.tar.gz"
            mkdir -p Content
            tar -xzf "${RUNNER_TEMP}/content.tar.gz" -C Content --strip-components=1
          fi
          if [ ! -f Content/catalog.json ]; then
            echo "::error::Content/catalog.json is missing. Commit the packed library (remove 'Content/' from .gitignore) or set the GH_CONTENT_URL repository variable to a tarball of Content/."
            exit 1
          fi

      - name: Detect signing material
        id: signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          WANT_SIGNED: ${{ inputs.signed }}
        run: |
          set -euo pipefail
          if [ "${WANT_SIGNED}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${TEAM_ID}" ] || [ -z "${CERT}" ] || [ -z "${API_KEY}" ]; then
            echo "::error::A signed build was requested, but APPLE_TEAM_ID, APPLE_CERT_P12_BASE64 and APPLE_API_KEY_P8_BASE64 are not all configured."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          echo "$API_KEY" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
          rm -f "${RUNNER_TEMP}/cert.p12"

      - name: Configure (Xcode, iOS)
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGH_BUILD_TESTS=OFF \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON

      - name: Build AUv3 + Standalone (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          xcodebuild -project "$BUILD_DIR/GhostDrums.xcodeproj" \
            -target GhostDrums_Standalone -configuration Release -sdk iphoneos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Build AUv3 + Standalone (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project "$BUILD_DIR/GhostDrums.xcodeproj" \
            -target GhostDrums_Standalone -configuration Release -sdk iphoneos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            -quiet build

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^project\(GhostDrums VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then SUFFIX=""; else SUFFIX="-unsigned"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          APP="$(find "$BUILD_DIR" -type d -name 'GHOST HEALER DRUMS.app' | head -n1)"
          if [ -z "$APP" ]; then
            echo "::error::Build produced no GHOST HEALER DRUMS.app."
            find "$BUILD_DIR" -maxdepth 3 -type d -name '*.app' -o -maxdepth 3 -type d -name '*.appex'
            exit 1
          fi

          APPEX="$(find "$APP" -type d -name '*.appex' | head -n1)"
          if [ -z "$APPEX" ]; then
            echo "::error::The AUv3 extension is not embedded in the container app."
            exit 1
          fi
          if [ -z "$(find "$APPEX" -type f -path '*GHLibrary/*' -name 'catalog.json' | head -n1)" ]; then
            echo "::error::The sample library is missing from the AUv3 bundle (Resources/GHLibrary/catalog.json)."
            exit 1
          fi

          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          lipo -info "$APP/$EXE"

          mkdir -p out Payload
          cp -R "$APP" Payload/
          xattr -cr Payload || true
          zip -qry -X "out/GHOST-HEALER-DRUMS-${VERSION}-ios${SUFFIX}.ipa" Payload
          ditto -c -k --keepParent "$APPEX" "out/GHOST-HEALER-DRUMS-${VERSION}-AUv3${SUFFIX}.appex.zip"
          rm -rf Payload
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-HEALER-DRUMS-${{ steps.package.outputs.version }}-ios
          path: out/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "GHOST HEALER DRUMS $TAG" --notes "Automated iOS AUv3 + IPA build."
          gh release upload "$TAG" out/*.ipa out/*.zip --clobber
